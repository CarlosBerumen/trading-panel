name: Actualizar datos y publicar
on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC, después del cierre de EE. UU., México y de la vela diaria de cripto
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "config/**", "tests/**", ".github/workflows/deploy.yml"]
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "22"}
      - name: Pruebas
        run: |
          python -m pip install "pytest>=8,<9"
          python -m pytest -q
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Descargar y validar datos
        run: python scripts/update_data.py
      - name: Guardar datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || { git commit -m "datos: $(date -u +%F)"; git push; }
  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: {path: site}
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
